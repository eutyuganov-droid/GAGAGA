<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chelyabinsk RP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      cursor: none;
      pointer-events: none;
    }
    a, button, input, textarea, select { display: none !important; }
    .loop {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }
    .loop img {
      position: absolute;
      inset: -6%;
      width: 112%;
      height: 112%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.4s ease;
      animation: drift 24s ease-in-out infinite alternate;
      filter: brightness(0.72) contrast(1.06) saturate(0.9);
      pointer-events: none;
    }
    .loop img.on { opacity: 1; }
    @keyframes drift {
      from { transform: scale(1.05) translate(0, 0); }
      to { transform: scale(1.16) translate(-2%, -1.5%); }
    }
    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.35), transparent 40%, rgba(0,0,0,0.4));
    }
    .title {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(26px, 5vw, 56px);
      font-weight: 700;
      letter-spacing: 0.28em;
      color: rgba(255,255,255,0.95);
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 28px rgba(0,0,0,0.85), 0 0 40px rgba(0,0,0,0.5);
      white-space: nowrap;
      pointer-events: none;
    }
    .title span { color: #d4a35a; }
  </style>
</head>
<body>
  <div class="loop" id="loop">
    <img class="on" src="assets/bg/bg-01.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-02.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-03.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-04.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-05.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-06.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-07.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-08.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-09.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-10.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-11.jpg" alt="" draggable="false" />
    <img src="assets/bg/bg-12.jpg" alt="" draggable="false" />
  </div>
  <div class="shade"></div>
  <div class="title">Chelyabinsk <span>RP</span></div>

  <script>
    (function () {
      var imgs = document.querySelectorAll("#loop img");
      var i = 0;
      setInterval(function () {
        imgs[i].classList.remove("on");
        i = (i + 1) % imgs.length;
        imgs[i].classList.add("on");
      }, 6000);

      document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
      document.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); }, true);
      document.addEventListener("mousedown", function (e) { e.preventDefault(); }, true);
      document.addEventListener("keydown", function (e) { e.preventDefault(); }, true);

      window.GameDetails = function () {};
      window.SetFilesTotal = function () {};
      window.SetFilesNeeded = function () {};
      window.DownloadingFile = function () {};
      window.SetStatusChanged = function () {};
    })();
  </script>
</body>
</html>
