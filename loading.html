<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MANHUNT</title>
  <style>
    @font-face {
      font-family: "Oswald";
      src: url("assets/fonts/oswald-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Oswald";
      src: url("assets/fonts/oswald-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Share Tech Mono";
      src: url("assets/fonts/share-tech-mono.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070706;
      color: #d6cec3;
      font-family: "Share Tech Mono", Consolas, monospace;
      user-select: none;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #070706;
    }

    .stage.is-glitch {
      transform: translate(2px, -1px);
    }

    .slide {
      position: absolute;
      inset: -4%;
      width: 108%;
      height: 108%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      filter: grayscale(0.38) contrast(1.12) brightness(0.52) saturate(0.55);
      transform: scale(1.04);
      transition: opacity 1.8s ease;
    }

    .slide.is-on {
      opacity: 1;
      animation: ken 22s ease-in-out infinite alternate;
    }

    @keyframes ken {
      from { transform: scale(1.04) translate(0, 0); }
      to { transform: scale(1.12) translate(-1.4%, -0.8%); }
    }

    .grade,
    .concrete,
    .grain,
    .scratches,
    .scan,
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .grade {
      background:
        linear-gradient(180deg, rgba(8, 7, 6, 0.42) 0%, rgba(8, 7, 6, 0.08) 38%, rgba(8, 7, 6, 0.78) 100%),
        linear-gradient(90deg, rgba(10, 9, 8, 0.35) 0%, transparent 22%, transparent 78%, rgba(10, 9, 8, 0.35) 100%);
      z-index: 2;
    }

    .concrete {
      z-index: 3;
      background: url("assets/fx/concrete.jpg") center / cover no-repeat;
      opacity: 0.14;
      mix-blend-mode: multiply;
    }

    .grain {
      z-index: 4;
      background: url("assets/fx/grain.jpg") repeat;
      background-size: 380px 380px;
      opacity: 0.16;
      mix-blend-mode: overlay;
      animation: grain 0.32s steps(2) infinite;
    }

    .scratches {
      z-index: 5;
      background: url("assets/fx/scratches.jpg") center / cover no-repeat;
      opacity: 0.11;
      mix-blend-mode: screen;
    }

    .scan {
      z-index: 6;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.16) 3px
      );
      opacity: 0.28;
    }

    .vignette {
      z-index: 7;
      box-shadow: inset 0 0 140px 36px rgba(0, 0, 0, 0.72);
    }

    @keyframes grain {
      from { background-position: 0 0; }
      to { background-position: 12px -8px; }
    }

    .title {
      position: fixed;
      left: 0;
      right: 0;
      top: 44%;
      z-index: 12;
      margin: 0;
      text-align: center;
      font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(56px, 11vw, 148px);
      line-height: 0.9;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      text-transform: uppercase;
      color: #e7e0d6;
      text-shadow: 0 2px 28px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    .caption {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 7%;
      z-index: 12;
      text-align: center;
      font-size: clamp(13px, 1.6vw, 18px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(214, 206, 195, 0.78);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    .flick {
      position: fixed;
      z-index: 10;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(214, 206, 195, 0.38);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
    }

    .flick.is-on {
      opacity: 1;
    }

    .flick.is-hard {
      color: rgba(180, 70, 62, 0.55);
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="slides"></div>
    <div class="grade"></div>
    <div class="concrete"></div>
    <div class="grain"></div>
    <div class="scratches"></div>
    <div class="scan"></div>
    <div class="vignette"></div>
  </div>

  <div id="flecks"></div>
  <h1 class="title">MANHUNT</h1>
  <div class="caption" id="caption">Я хочу хорошее шоу.</div>

  <script>
    (function () {
      var SCENES = [
        "assets/bg/01-alley.jpg",
        "assets/bg/02-warehouse.jpg",
        "assets/bg/03-garage.jpg",
        "assets/bg/04-underpass.jpg",
        "assets/bg/05-fence.jpg",
        "assets/bg/06-corridor.jpg"
      ];

      var CAPTIONS = [
        "Я хочу хорошее шоу.",
        "Сделай это красиво.",
        "Не дай им себя увидеть.",
        "Камера уже пишет.",
        "Бей сзади. Тихо.",
        "Они тебя не видят.",
        "Это будет больно.",
        "Добей его.",
        "Не шуми.",
        "Сними это.",
        "Ещё один.",
        "В тени. Жди.",
        "Покажи им.",
        "Режиссёр смотрит.",
        "Не стой на свету.",
        "Удар. Пауза. Удар."
      ];

      var WORDS = [
        "УБЕЙ", "ТЕНЬ", "СЦЕНА", "КРОВЬ", "ТИШЕ", "УДАР", "ЖДИ", "СМОТРИ",
        "ДОБЕЙ", "РЕЖИССЁР", "КАМЕРА", "ЖИВОЙ", "МЁРТВЫЙ", "ОХОТА", "ДОБЫЧА",
        "НОЧЬ", "УЛИЦА", "ПОДВАЛ", "ЗАБОР", "СПИНА", "ГОРЛО", "МЕШОК",
        "БИТА", "НОЖ", "ПРОВОЛОКА", "БЕГИ", "СТОЙ", "РЕЖЬ", "ДАВИ",
        "EXECUTE", "HUNT", "CASH", "CUT", "LIVE", "KILL", "SCENE",
        "CAM", "REC", "DIRTY", "CLOSE", "QUIET", "NOW", "AGAIN",
        "07", "11", "23:41", "OK", "NO", "YES", "ERR", "SIG"
      ];

      var slidesEl = document.getElementById("slides");
      var nodes = [];
      var i, n;

      for (i = 0; i < SCENES.length; i++) {
        n = document.createElement("div");
        n.className = "slide";
        n.style.backgroundImage = "url('" + SCENES[i] + "')";
        slidesEl.appendChild(n);
        nodes.push(n);
      }

      var idx = 0;
      nodes[0].className = "slide is-on";
      setInterval(function () {
        nodes[idx].className = "slide";
        idx = (idx + 1) % nodes.length;
        nodes[idx].className = "slide is-on";
      }, 7000);

      var capI = 0;
      setInterval(function () {
        capI = (capI + 1) % CAPTIONS.length;
        document.getElementById("caption").innerHTML = CAPTIONS[capI];
      }, 4500);

      var stage = document.getElementById("stage");
      setInterval(function () {
        if (Math.random() > 0.4) return;
        stage.className = "stage is-glitch";
        setTimeout(function () { stage.className = "stage"; }, 70);
      }, 9000);

      var flecks = document.getElementById("flecks");
      var pool = [];
      for (i = 0; i < 14; i++) {
        n = document.createElement("div");
        n.className = "flick";
        flecks.appendChild(n);
        pool.push(n);
      }

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function flashOne(el) {
        var x = 4 + Math.random() * 88;
        var y = 6 + Math.random() * 82;
        if (y > 38 && y < 58) y = Math.random() < 0.5 ? 12 + Math.random() * 18 : 62 + Math.random() * 20;
        el.style.left = x + "%";
        el.style.top = y + "%";
        el.style.fontSize = (10 + Math.floor(Math.random() * 8)) + "px";
        el.innerHTML = pick(WORDS);
        el.className = Math.random() < 0.18 ? "flick is-on is-hard" : "flick is-on";
        setTimeout(function () {
          el.className = "flick";
        }, 180 + Math.random() * 900);
      }

      setInterval(function () {
        var count = 1 + Math.floor(Math.random() * 3);
        var used = [];
        while (used.length < count) {
          var el = pick(pool);
          if (used.indexOf(el) !== -1) continue;
          used.push(el);
          flashOne(el);
        }
      }, 220);

      window.GameDetails = function () {};
      window.SetFilesTotal = function () {};
      window.SetFilesNeeded = function () {};
      window.DownloadingFile = function () {};
      window.SetStatusChanged = function () {};
    })();
  </script>
</body>
</html>
