<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chelyabinsk RP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
      cursor: none;
      pointer-events: none;
    }
    a, button, input, textarea, select { display: none !important; }
    .loop {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }
    .loop img {
      position: absolute;
      inset: -6%;
      width: 112%;
      height: 112%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.4s ease;
      animation: drift 24s ease-in-out infinite alternate;
      filter: brightness(0.78) contrast(1.05) saturate(0.85);
      pointer-events: none;
    }
    .loop img.on { opacity: 1; }
    @keyframes drift {
      from { transform: scale(1.05) translate(0, 0); }
      to { transform: scale(1.16) translate(-2%, -1.5%); }
    }
    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.55) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.25), transparent 30%, rgba(0,0,0,0.55));
    }
    .title {
      position: fixed;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      z-index: 2;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(22px, 4vw, 42px);
      font-weight: 700;
      letter-spacing: 0.28em;
      color: rgba(255,255,255,0.92);
      text-transform: uppercase;
      text-shadow: 0 2px 24px rgba(0,0,0,0.8);
      white-space: nowrap;
      pointer-events: none;
    }
    .title span { color: #d4a35a; }
  </style>
</head>
<body>
  <div class="loop" id="loop">
    <img class="on" src="assets/hero.png" alt="" draggable="false" />
    <img src="assets/night.png" alt="" draggable="false" />
    <img src="assets/street.png" alt="" draggable="false" />
    <img src="assets/panel.png" alt="" draggable="false" />
  </div>
  <div class="shade"></div>
  <div class="title">Chelyabinsk <span>RP</span></div>

  <script>
    (function () {
      var imgs = document.querySelectorAll("#loop img");
      var i = 0;
      setInterval(function () {
        imgs[i].classList.remove("on");
        i = (i + 1) % imgs.length;
        imgs[i].classList.add("on");
      }, 6000);

      document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
      document.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); }, true);
      document.addEventListener("mousedown", function (e) { e.preventDefault(); }, true);
      document.addEventListener("keydown", function (e) { e.preventDefault(); }, true);

      window.GameDetails = function () {};
      window.SetFilesTotal = function () {};
      window.SetFilesNeeded = function () {};
      window.DownloadingFile = function () {};
      window.SetStatusChanged = function () {};
    })();
  </script>
</body>
</html>
