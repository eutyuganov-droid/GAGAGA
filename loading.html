<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="https://eutyuganov-droid.github.io/GAGAGA/" />
  <title>Chelyabinsk RP</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      cursor: none;
    }
    .loop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      background: #000;
      z-index: 0;
    }
    .loop img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      z-index: 1;
    }
    .loop img.on {
      opacity: 1;
      z-index: 2;
    }
    .shade {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 3;
      background: rgba(0,0,0,0.35);
    }
    .title {
      position: fixed;
      left: 50%;
      top: 50%;
      margin-left: -280px;
      margin-top: -28px;
      width: 560px;
      z-index: 4;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #f2f2f2;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 24px #000;
    }
    .title span { color: #d4a35a; }

    .egg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 20;
      display: none;
      background: #000;
    }
    .egg.show { display: block; }
    .egg img {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 420px;
      margin-left: -210px;
      margin-top: -210px;
    }
    .egg-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14%;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 18px #000;
    }

    .devlog {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      padding: 14px 18px 16px;
      background: rgba(0,0,0,0.78);
      display: none;
    }
    .devlog.show { display: block; }
    .devlog-head {
      margin-bottom: 6px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #d4a35a;
    }
    .devlog-track {
      overflow: hidden;
      white-space: nowrap;
      width: 100%;
    }
    .devlog-marquee {
      display: inline-block;
      white-space: nowrap;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      color: #d8dde3;
      animation: marquee 55s linear infinite;
    }
    .devlog-marquee .item { display: inline-block; margin-right: 36px; }
    .devlog-marquee .date { color: #d4a35a; margin-right: 8px; }
    .devlog-marquee .sep { margin: 0 18px; color: #555; }
    @keyframes marquee {
      from { margin-left: 0; }
      to { margin-left: -50%; }
    }
  </style>
</head>
<body>
  <div class="loop" id="loop">
    <img class="on" id="bg0" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-01.jpg" alt="" />
    <img id="bg1" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-02.jpg" alt="" />
    <img id="bg2" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-03.jpg" alt="" />
    <img id="bg3" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-04.jpg" alt="" />
    <img id="bg4" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-05.jpg" alt="" />
    <img id="bg5" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-06.jpg" alt="" />
    <img id="bg6" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-07.jpg" alt="" />
    <img id="bg7" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-08.jpg" alt="" />
    <img id="bg8" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-09.jpg" alt="" />
    <img id="bg9" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-10.jpg" alt="" />
    <img id="bg10" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-11.jpg" alt="" />
    <img id="bg11" src="https://eutyuganov-droid.github.io/GAGAGA/assets/bg/bg-12.jpg" alt="" />
  </div>
  <div class="shade" id="shade"></div>
  <div class="title" id="title">Chelyabinsk <span>RP</span></div>

  <div class="devlog" id="devlog">
    <div class="devlog-head">Dev Log</div>
    <div class="devlog-track">
      <div class="devlog-marquee" id="devlogMarquee"></div>
    </div>
  </div>

  <div class="egg" id="egg">
    <img src="https://eutyuganov-droid.github.io/GAGAGA/assets/sanya.png" alt="" />
    <div class="egg-caption">Саня - Лох он же Xenon</div>
  </div>

  <script>
    (function () {
      var BASE = "https://eutyuganov-droid.github.io/GAGAGA/";
      var eggRoll = Math.random() < 0.01;

      if (eggRoll) {
        document.getElementById("egg").className = "egg show";
        document.getElementById("loop").style.display = "none";
        document.getElementById("shade").style.display = "none";
        document.getElementById("title").style.display = "none";
        document.getElementById("devlog").style.display = "none";
      } else {
        var imgs = document.getElementById("loop").getElementsByTagName("img");
        var i = 0;
        // force first visible even if CSS class fails
        imgs[0].style.opacity = "1";
        setInterval(function () {
          imgs[i].className = "";
          imgs[i].style.opacity = "0";
          i = (i + 1) % imgs.length;
          imgs[i].className = "on";
          imgs[i].style.opacity = "1";
        }, 6000);
        loadDevLog();
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderEntries(entries) {
        var el = document.getElementById("devlogMarquee");
        var box = document.getElementById("devlog");
        if (!entries || !entries.length) return;
        var html = "";
        var n, j, e;
        for (n = 0; n < 2; n++) {
          for (j = 0; j < entries.length; j++) {
            e = entries[j];
            html += '<span class="item"><span class="date">' + esc(e.date) + "</span>" + esc(e.text) + '</span><span class="sep">///</span>';
          }
        }
        el.innerHTML = html;
        box.className = "devlog show";
      }

      function normalizeManual(data) {
        var out = [];
        var list = (data && data.entries) || [];
        var i;
        for (i = 0; i < list.length; i++) {
          if (!list[i] || !list[i].text) continue;
          out.push({ date: list[i].date || "", text: list[i].text });
        }
        return out;
      }

      function normalizeCommits(commits) {
        var out = [];
        var i, c, msg, date;
        for (i = 0; i < (commits || []).length; i++) {
          c = commits[i];
          if (!c || !c.commit) continue;
          msg = (c.commit.message || "").split("\n")[0].trim();
          if (!msg) continue;
          if (/^merge /i.test(msg)) continue;
          date = "";
          if (c.commit.author && c.commit.author.date) date = String(c.commit.author.date).slice(0, 10);
          out.push({ date: date, text: msg });
        }
        return out;
      }

      function mergeUnique(primary, secondary, max) {
        var seen = {};
        var out = [];
        function add(arr) {
          var i, key;
          for (i = 0; i < arr.length; i++) {
            key = (arr[i].date + "|" + arr[i].text).toLowerCase();
            if (seen[key]) continue;
            seen[key] = 1;
            out.push(arr[i]);
            if (out.length >= max) return;
          }
        }
        add(primary);
        add(secondary);
        return out;
      }

      function loadDevLog() {
        var bust = "?t=" + (new Date()).getTime();
        var manualP = fetch(BASE + "devlog.json" + bust)
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
        var commitsP = fetch("https://api.github.com/repos/eutyuganov-droid/GAGAGA/commits?per_page=12")
          .then(function (r) { return r.ok ? r.json() : []; })
          .catch(function () { return []; });
        Promise.all([manualP, commitsP]).then(function (res) {
          renderEntries(mergeUnique(normalizeManual(res[0]), normalizeCommits(res[1]), 16));
        });
      }

      window.GameDetails = function () {};
      window.SetFilesTotal = function () {};
      window.SetFilesNeeded = function () {};
      window.DownloadingFile = function () {};
      window.SetStatusChanged = function () {};
    })();
  </script>
</body>
</html>
