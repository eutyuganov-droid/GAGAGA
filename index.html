<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MELEECITY+ | Manhunt Style Psychosis</title>
  <style>
    :root {
      --bg: #000000;
      --text: #9a9a9a;
      --white: #e0e0e0;
      --accent: #ffffff;
      --dark-line: #2a2a2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      font-family: 'Courier New', 'Lucida Console', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: none;
    }

    /* Базовые эффекты окружения */
    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      background-image: repeating-radial-gradient(circle at 50% 50%, transparent 0, rgba(255, 255, 255, 0.02) 1px, transparent 2px);
      background-size: 4px 4px;
      animation: grain 0.5s steps(5) infinite;
    }
    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, -1px); }
    }
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 11;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.3) 2px, rgba(0, 0, 0, 0.3) 4px);
    }
    
    .vignette {
      display: none;
    }

    /* Контейнер */
    .container {
      position: relative;
      z-index: 5;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* ЗАГОЛОВОК С ПОБУКВЕННЫМИ ЭФФЕКТАМИ */
    .title-wrapper {
      position: relative;
      display: inline-block;
    }
    .title {
      font-size: 76px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 14px;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 rgba(255, 255, 255, 0.15), -1px -1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      line-height: 1;
      display: inline-block;
    }
    
    /* Каждая буква — отдельный span */
    .title-letter {
      display: inline-block;
      transition: color 0.15s ease, transform 0.15s ease, text-shadow 0.15s ease, opacity 0.15s ease;
      position: relative;
    }
    
    /* Чёрная буква */
    .title-letter.black-letter {
      color: #000000 !important;
      text-shadow: none !important;
    }
    
    /* Красная буква */
    .title-letter.red-letter {
      color: #ff1a1a !important;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.9), 0 0 40px rgba(255, 0, 0, 0.6) !important;
    }
    
    /* Глитч влево */
    .title-letter.glitch-left {
      animation: letter-glitch-left 0.4s steps(3) forwards;
    }
    @keyframes letter-glitch-left {
      0% { transform: translate(0, 0); opacity: 1; }
      20% { transform: translate(-8px, 3px); opacity: 0.7; }
      40% { transform: translate(5px, -2px); opacity: 0.9; }
      60% { transform: translate(-12px, -4px); opacity: 0.4; }
      80% { transform: translate(3px, 1px); opacity: 0.8; }
      100% { transform: translate(0, 0); opacity: 1; }
    }
    
    /* Глитч вправо */
    .title-letter.glitch-right {
      animation: letter-glitch-right 0.4s steps(3) forwards;
    }
    @keyframes letter-glitch-right {
      0% { transform: translate(0, 0); opacity: 1; }
      20% { transform: translate(8px, -3px); opacity: 0.7; }
      40% { transform: translate(-5px, 2px); opacity: 0.9; }
      60% { transform: translate(12px, 4px); opacity: 0.4; }
      80% { transform: translate(-3px, -1px); opacity: 0.8; }
      100% { transform: translate(0, 0); opacity: 1; }
    }
    
    /* Глитч вверх */
    .title-letter.glitch-up {
      animation: letter-glitch-up 0.35s steps(3) forwards;
    }
    @keyframes letter-glitch-up {
      0% { transform: translate(0, 0); opacity: 1; }
      25% { transform: translate(3px, -10px); opacity: 0.5; }
      50% { transform: translate(-4px, 3px); opacity: 0.9; }
      75% { transform: translate(2px, -7px); opacity: 0.6; }
      100% { transform: translate(0, 0); opacity: 1; }
    }
    
    /* Глитч вниз */
    .title-letter.glitch-down {
      animation: letter-glitch-down 0.35s steps(3) forwards;
    }
    @keyframes letter-glitch-down {
      0% { transform: translate(0, 0); opacity: 1; }
      25% { transform: translate(-3px, 10px); opacity: 0.5; }
      50% { transform: translate(4px, -3px); opacity: 0.9; }
      75% { transform: translate(-2px, 7px); opacity: 0.6; }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    .separator {
      width: 180px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #4a4a4a 15%, #8a8a8a 50%, #4a4a4a 85%, transparent 100%);
      opacity: 0.8;
    }

    /* Большая философская надпись */
    .big-subtitle {
      font-size: 18px;
      color: #999999;
      letter-spacing: 6px;
      text-transform: uppercase;
      opacity: 0.75;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
      animation: pulse-text 2.5s ease-in-out infinite;
      font-weight: bold;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      position: relative;
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }
    
    .big-subtitle.red-flash {
      color: #ff1a1a;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.9), 0 0 40px rgba(255, 0, 0, 0.5);
      animation: red-pulse 0.8s ease-out;
    }
    @keyframes red-pulse {
      0% { 
        color: #ff1a1a; 
        text-shadow: 0 0 20px rgba(255, 0, 0, 0.9), 0 0 40px rgba(255, 0, 0, 0.5);
        opacity: 1;
      }
      50% { 
        color: #ff4d4d; 
        text-shadow: 0 0 30px rgba(255, 0, 0, 1), 0 0 60px rgba(255, 0, 0, 0.7);
        opacity: 0.95;
      }
      100% { 
        color: #999999; 
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        opacity: 0.75;
      }
    }

    /* Анимированные точки */
    .dots-container {
      display: inline-block;
      margin-left: 2px;
    }
    .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      margin-left: 5px;
      vertical-align: middle;
      opacity: 0;
      animation: dot-sequence 1.8s infinite;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }
    @keyframes dot-sequence {
      0%, 40% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      60%, 100% { opacity: 0; transform: scale(0.5); }
    }
    .dot.red-dot {
      background: #ff1a1a;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.9);
    }

    /* Угловые элементы */
    .corner-decoration { position: fixed; z-index: 3; pointer-events: none; }
    .corner-top-left { top: 30px; left: 30px; }
    .corner-top-right { top: 30px; right: 30px; }
    .corner-bottom-left { bottom: 30px; left: 30px; }
    .corner-bottom-right { bottom: 30px; right: 30px; }
    .corner-line { display: block; width: 30px; height: 1px; background: rgba(255, 255, 255, 0.15); margin: 5px 0; }
    .corner-top-left .corner-line:nth-child(1) { width: 32px; }
    .corner-top-left .corner-line:nth-child(2) { width: 20px; }
    .corner-top-left .corner-line:nth-child(3) { width: 10px; }
    .corner-top-right .corner-line:nth-child(1) { width: 10px; margin-left: auto; }
    .corner-top-right .corner-line:nth-child(2) { width: 20px; margin-left: auto; }
    .corner-top-right .corner-line:nth-child(3) { width: 32px; margin-left: auto; }
    .corner-bottom-left .corner-line:nth-child(1) { width: 10px; }
    .corner-bottom-left .corner-line:nth-child(2) { width: 20px; }
    .corner-bottom-left .corner-line:nth-child(3) { width: 32px; }
    .corner-bottom-right .corner-line:nth-child(1) { width: 32px; margin-left: auto; }
    .corner-bottom-right .corner-line:nth-child(2) { width: 20px; margin-left: auto; }
    .corner-bottom-right .corner-line:nth-child(3) { width: 10px; margin-left: auto; }

    /* Плавающий текст */
    .float-text {
      position: fixed;
      pointer-events: none;
      z-index: 8;
      font-family: 'Courier New', monospace;
      opacity: 0;
      transition: opacity 0.4s ease;
      text-transform: uppercase;
      will-change: transform, opacity;
    }
    .float-sm { font-size: 10px; letter-spacing: 4px; }
    .float-md { font-size: 13px; letter-spacing: 6px; font-weight: bold; }
    .float-lg { font-size: 18px; letter-spacing: 8px; font-weight: bold; }
    .float-xl { font-size: 24px; letter-spacing: 10px; font-weight: bold; }
    .float-bright { color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.6); }
    .float-mid { color: #aaaaaa; text-shadow: 0 0 6px rgba(255,255,255,0.3); }
    .float-dim { color: #666666; }
    .float-faint { color: #444444; }
    .float-glitch {
      animation: float-glitch-anim 0.3s steps(3) forwards;
    }
    @keyframes float-glitch-anim {
      0% { transform: translate(0, 0); opacity: 0.9; }
      20% { transform: translate(-4px, 2px); opacity: 0.7; }
      40% { transform: translate(3px, -1px); opacity: 1; }
      60% { transform: translate(-2px, -3px); opacity: 0.5; }
      80% { transform: translate(5px, 1px); opacity: 0.8; }
      100% { transform: translate(0, 0); opacity: 0; }
    }
    .float-red-flash {
      animation: red-text-flash 0.6s ease-out forwards !important;
    }
    @keyframes red-text-flash {
      0% { color: #ff1a1a; text-shadow: 0 0 15px rgba(255, 0, 0, 0.9), 0 0 30px rgba(255, 0, 0, 0.6); opacity: 0.95; }
      40% { color: #ff4d4d; text-shadow: 0 0 20px rgba(255, 0, 0, 1), 0 0 40px rgba(255, 0, 0, 0.8); opacity: 1; }
      100% { color: inherit; text-shadow: inherit; opacity: inherit; }
    }

    /* Эффекты VHS */
    .tracking-line {
      position: fixed;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
      z-index: 9;
      animation: tracking-move 4s linear infinite;
    }
    @keyframes tracking-move { 0% { top: -5%; } 100% { top: 105%; } }

    .static-burst {
      position: fixed;
      pointer-events: none;
      z-index: 13;
      background: rgba(255, 255, 255, 0.04);
      animation: burst 0.15s steps(4) forwards;
    }
    @keyframes burst { 0% { opacity: 0.7; } 50% { opacity: 0.15; } 100% { opacity: 0; } }

    .bracket-flash {
      position: fixed;
      pointer-events: none;
      z-index: 4;
      color: #ffffff;
      font-size: 20px;
      opacity: 0;
      animation: bracket-pop 0.6s ease-out forwards;
    }
    @keyframes bracket-pop {
      0% { opacity: 0; transform: scale(0.8); }
      30% { opacity: 0.9; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1); }
    }

    /* СТИЛИ ДЛЯ ПСИХОЗНЫХ КАРТИНОК */
    .psycho-image {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      border: none;
      outline: none;
      box-shadow: 
        0 0 40px 20px rgba(0, 0, 0, 0.9),
        0 0 80px 40px rgba(0, 0, 0, 0.8),
        inset 0 0 60px 30px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.06s ease;
      -webkit-mask-image: radial-gradient(ellipse at center, 
        rgba(0, 0, 0, 1) 40%, 
        rgba(0, 0, 0, 0.8) 60%, 
        rgba(0, 0, 0, 0.3) 80%, 
        rgba(0, 0, 0, 0) 100%);
      mask-image: radial-gradient(ellipse at center, 
        rgba(0, 0, 0, 1) 40%, 
        rgba(0, 0, 0, 0.8) 60%, 
        rgba(0, 0, 0, 0.3) 80%, 
        rgba(0, 0, 0, 0) 100%);
      filter: grayscale(0.85) contrast(1.4) brightness(0.75) blur(0.5px);
      mix-blend-mode: hard-light;
      transform-origin: center;
      image-rendering: auto;
    }
    .psycho-image.show {
      opacity: 0.8;
      animation: psycho-pop 0.12s ease-out;
    }
    @keyframes psycho-pop {
      0% { transform: scale(0.7); opacity: 0; filter: grayscale(0.85) contrast(1.4) brightness(0.75) blur(2px); }
      40% { transform: scale(1.08); opacity: 0.9; filter: grayscale(0.5) contrast(1.6) brightness(0.85) blur(0.5px); }
      100% { transform: scale(1); opacity: 0.8; filter: grayscale(0.85) contrast(1.4) brightness(0.75) blur(0.5px); }
    }
    .psycho-image.flash {
      opacity: 0.95;
      filter: grayscale(0.1) contrast(2.0) brightness(1.2) blur(0px);
      mix-blend-mode: normal;
      box-shadow: 0 0 50px 25px rgba(255, 255, 255, 0.2), 0 0 100px 50px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="scanlines"></div>
  <div class="tracking-line"></div>

  <div class="corner-decoration corner-top-left"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>
  <div class="corner-decoration corner-top-right"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>
  <div class="corner-decoration corner-bottom-left"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>
  <div class="corner-decoration corner-bottom-right"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>

  <div class="container">
    <div class="title-wrapper">
      <h1 class="title" id="mainTitle"></h1>
    </div>
    <div class="separator"></div>
    <p class="big-subtitle" id="mainPhrase">
      ВЫ СТАНОВИТЕСЬ ЧЕМ-ТО БОЛЬШИМ
      <span class="dots-container" id="dotsContainer">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
    </p>
  </div>

  <div id="floatingTexts"></div>
  <div id="psychoImages"></div>

  <script>
    (function() {
      // ---------- ГЕНЕРАЦИЯ ЗАГОЛОВКА С ПОБУКВЕННЫМИ ЭФФЕКТАМИ ----------
      const titleText = "MELEECITY+";
      const mainTitleElement = document.getElementById('mainTitle');
      
      // Создаём заголовок из отдельных букв
      function buildTitle() {
        mainTitleElement.innerHTML = '';
        for (let i = 0; i < titleText.length; i++) {
          const letterSpan = document.createElement('span');
          letterSpan.classList.add('title-letter');
          letterSpan.textContent = titleText[i];
          letterSpan.setAttribute('data-index', i);
          mainTitleElement.appendChild(letterSpan);
        }
      }
      
      buildTitle();
      
      const titleLetters = mainTitleElement.querySelectorAll('.title-letter');
      
      // Эффекты для случайных букв
      const glitchClasses = ['glitch-left', 'glitch-right', 'glitch-up', 'glitch-down'];
      
      function applyRandomLetterEffect() {
        // Выбираем 1-3 случайные буквы
        const affectedCount = randomInt(1, 3);
        const totalLetters = titleLetters.length;
        
        // Выбираем уникальные индексы
        const indices = [];
        while (indices.length < affectedCount) {
          const idx = Math.floor(Math.random() * totalLetters);
          if (!indices.includes(idx)) {
            indices.push(idx);
          }
        }
        
        // Применяем эффекты к выбранным буквам
        indices.forEach(idx => {
          const letter = titleLetters[idx];
          const effectType = Math.random();
          
          if (effectType < 0.3) {
            // ЧЁРНАЯ БУКВА (30% шанс)
            letter.classList.add('black-letter');
            setTimeout(() => {
              letter.classList.remove('black-letter');
            }, randomFloat(200, 600));
            
          } else if (effectType < 0.55) {
            // КРАСНАЯ БУКВА (25% шанс)
            letter.classList.add('red-letter');
            setTimeout(() => {
              letter.classList.remove('red-letter');
            }, randomFloat(300, 700));
            
          } else {
            // ГЛИТЧ В СТОРОНУ (45% шанс)
            const glitchClass = randomFromArray(glitchClasses);
            letter.classList.add(glitchClass);
            setTimeout(() => {
              letter.classList.remove(glitchClass);
            }, 400);
          }
        });
        
        // Планируем следующий эффект
        const nextDelay = randomFloat(1500, 5000);
        setTimeout(applyRandomLetterEffect, nextDelay);
      }
      
      // Запускаем эффекты для букв
      setTimeout(applyRandomLetterEffect, 2000);
      
      // ---------- ФИЛОСОФСКИЕ ФРАЗЫ ДЛЯ ГЛАВНОЙ НАДПИСИ ----------
      const philosophicalPhrases = [
        "ВЫ СТАНОВИТЕСЬ ЧЕМ-ТО БОЛЬШИМ",
        "ПОДОПЫТНЫЙ БЕЗ ЦЕЛИ",
        "В НАШЕМ КРОВАВОМ ЭКСПЕРИМЕНТЕ",
        "ОН МОЖЕТ СТАТЬ КЕМ-ТО ВАЖНЫМ",
        "ИЛИ ИСЧЕЗНУТЬ НАВСЕГДА",
        "ЖЕРТВА СТАНОВИТСЯ ОХОТНИКОМ",
        "БОЛЬ — ЭТО ТВОЙ УРОК",
        "ТЫ ВСЕГО ЛИШЬ ИНСТРУМЕНТ",
        "СМОТРИ В БЕЗДНУ",
        "БЕЗДНА СМОТРИ В ТЕБЯ",
        "ТВОЯ ЖИЗНЬ — РАЗМЕННАЯ МОНЕТА",
        "КТО-ТО СТАНЕТ ЛЕГЕНДОЙ",
        "А КТО-ТО — ПРОСТО МЯСОМ",
        "ЭКСПЕРИМЕНТ ПРОДОЛЖАЕТСЯ",
        "ТЫ — СЛЕДУЮЩИЙ",
        "СТРАХ — ЭТО ДАР",
        "ПРИМИ СВОЮ РОЛЬ",
        "ВЫХОДА НЕТ",
        "ЛИШЬ ВПЕРЁД",
        "СТАНЬ ТЕМ, КЕМ ДОЛЖЕН"
      ];
      
      let currentPhraseIndex = 0;
      
      const mainPhraseElement = document.getElementById('mainPhrase');
      
      function updateMainPhrase(text) {
        const dotsHTML = '<span class="dots-container" id="dotsContainer"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
        mainPhraseElement.innerHTML = text + ' ' + dotsHTML;
        
        const newDots = mainPhraseElement.querySelectorAll('.dot');
        newDots.forEach((dot, index) => {
          dot.style.animation = 'none';
          dot.offsetHeight;
          dot.style.animation = `dot-sequence 1.8s infinite`;
          dot.style.animationDelay = `${index * 0.3}s`;
        });
      }
      
      function scheduleNextPhrase() {
        const delay = randomFloat(5000, 9000);
        setTimeout(() => {
          let newIndex;
          do {
            newIndex = Math.floor(Math.random() * philosophicalPhrases.length);
          } while (newIndex === currentPhraseIndex && philosophicalPhrases.length > 1);
          
          currentPhraseIndex = newIndex;
          const newPhrase = philosophicalPhrases[newIndex];
          
          updateMainPhrase(newPhrase);
          
          mainPhraseElement.style.opacity = '0';
          setTimeout(() => {
            mainPhraseElement.style.opacity = '0.75';
          }, 150);
          
          scheduleNextPhrase();
        }, delay);
      }
      
      function scheduleRedFlashMain() {
        const delay = randomFloat(8000, 20000);
        setTimeout(() => {
          mainPhraseElement.classList.add('red-flash');
          
          const dots = mainPhraseElement.querySelectorAll('.dot');
          dots.forEach(dot => dot.classList.add('red-dot'));
          
          setTimeout(() => {
            mainPhraseElement.classList.remove('red-flash');
            dots.forEach(dot => dot.classList.remove('red-dot'));
          }, 800);
          
          scheduleRedFlashMain();
        }, delay);
      }

      // ---------- ПЛАВАЮЩИЙ ТЕКСТ ----------
      const floatingContainer = document.getElementById('floatingTexts');
      const phrases = [
        { text: "KILL OR BE KILLED", weight: 3 }, { text: "NO ESCAPE", weight: 3 },
        { text: "WATCH YOUR BACK", weight: 2 }, { text: "HE'S WATCHING", weight: 2 },
        { text: "RUN", weight: 3 }, { text: "HIDE", weight: 2 }, { text: "SURVIVE", weight: 3 },
        { text: "EXECUTE", weight: 2 }, { text: "HUNTED", weight: 2 }, { text: "PREY", weight: 2 },
        { text: "NO MERCY", weight: 2 }, { text: "FEAR", weight: 2 }, { text: "DEATH", weight: 2 },
        { text: "SILENCE", weight: 2 }, { text: "DARKNESS", weight: 2 }, { text: "OBEY", weight: 1 },
        { text: "NO HOPE", weight: 1 }, { text: "THE HUNT BEGINS", weight: 1 }, { text: "DON'T LOOK BACK", weight: 1 },
        { text: "MANHUNT", weight: 1 }, { text: "HATRED", weight: 1 },
        { text: "УБЕЙ ИЛИ УМРИ", weight: 1 }, { text: "ВЫХОДА НЕТ", weight: 1 }, { text: "СТРАХ", weight: 1 },
        { text: "СМЕРТЬ", weight: 1 }, { text: "БЕГИ", weight: 1 }, { text: "ПРЯЧЬСЯ", weight: 1 },
        { text: "ТЕНЬ", weight: 1 }, { text: "АГОНИЯ", weight: 1 }, { text: "САНЯ ЛОХ", weight: 1 }
      ];

      let weightedPhrases = [];
      phrases.forEach(p => { for (let i = 0; i < p.weight; i++) weightedPhrases.push(p.text); });

      const sizeClasses = ['float-sm', 'float-md', 'float-md', 'float-lg', 'float-xl'];
      const sizeWeights = [4, 5, 4, 2, 1];
      let weightedSizes = [];
      sizeClasses.forEach((s, i) => { for (let j = 0; j < sizeWeights[i]; j++) weightedSizes.push(s); });

      const colorClasses = ['float-bright', 'float-mid', 'float-mid', 'float-dim', 'float-dim', 'float-faint'];
      const colorWeights = [1, 3, 3, 3, 2, 2];
      let weightedColors = [];
      colorClasses.forEach((c, i) => { for (let j = 0; j < colorWeights[i]; j++) weightedColors.push(c); });

      function randomFromArray(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function randomFloat(min, max) { return Math.random() * (max - min) + min; }

      function spawnFloatingText() {
        const el = document.createElement('div');
        el.classList.add('float-text');
        el.classList.add(randomFromArray(weightedSizes));
        el.classList.add(randomFromArray(weightedColors));
        el.textContent = randomFromArray(weightedPhrases);

        let x, y;
        const zone = Math.random();
        if (zone < 0.25) { x = randomFloat(5, 90); y = randomFloat(3, 25); }
        else if (zone < 0.5) { x = randomFloat(5, 90); y = randomFloat(70, 93); }
        else if (zone < 0.75) { x = randomFloat(2, 20); y = randomFloat(20, 75); }
        else { x = randomFloat(78, 95); y = randomFloat(20, 75); }

        el.style.left = x + '%';
        el.style.top = y + '%';
        el.style.transform = `rotate(${randomFloat(-8, 8)}deg)`;

        if (Math.random() < 0.15) el.classList.add('float-glitch');
        
        if (Math.random() < 0.03) {
          el.classList.add('float-red-flash');
        }
        
        floatingContainer.appendChild(el);

        requestAnimationFrame(() => { el.style.opacity = '1'; });

        const isGlitch = el.classList.contains('float-glitch');
        const isRedFlash = el.classList.contains('float-red-flash');
        let lifetime;
        
        if (isRedFlash) {
          lifetime = 600;
        } else if (isGlitch) {
          lifetime = randomFloat(300, 600);
        } else {
          lifetime = randomFloat(2000, 5000);
        }
        
        setTimeout(() => { el.style.opacity = '0'; }, lifetime * 0.7);
        setTimeout(() => { if (el.parentNode) el.remove(); }, lifetime);
      }

      function spawnStaticBurst() {
        const burst = document.createElement('div');
        burst.classList.add('static-burst');
        burst.style.left = randomFloat(0, 95) + '%';
        burst.style.top = randomFloat(0, 95) + '%';
        burst.style.width = randomFloat(30, 200) + 'px';
        burst.style.height = randomFloat(2, 8) + 'px';
        document.body.appendChild(burst);
        setTimeout(() => { if (burst.parentNode) burst.remove(); }, 200);
      }

      function spawnBracketFlash() {
        const flash = document.createElement('div');
        flash.classList.add('bracket-flash');
        flash.textContent = randomFromArray(['[', ']', '//', '\\\\', '<', '>', '{', '}', '|', '#']);
        flash.style.left = randomFloat(3, 93) + '%';
        flash.style.top = randomFloat(3, 93) + '%';
        document.body.appendChild(flash);
        setTimeout(() => { if (flash.parentNode) flash.remove(); }, 700);
      }

      // ---------- ПСИХОЗНЫЕ КАРТИНКИ ----------
      const imageContainer = document.getElementById('psychoImages');
      
      const imageFiles = [];
      for (let i = 0; i <= 19; i++) {
        imageFiles.push(i + '.jpg');
      }
      
      console.log('Загружено изображений: ' + imageFiles.length + ' (0.jpg - 19.jpg)');
      
      const preloadedImages = [];
      imageFiles.forEach((file, index) => {
        const img = new Image();
        img.src = file;
        img.onerror = () => console.warn('Изображение не найдено: ' + file);
        img.onload = () => console.log('Загружено: ' + file);
        preloadedImages.push(img);
      });

      function getUniqueRandomIndices(count, maxIndex) {
        const availableIndices = [];
        for (let i = 0; i <= maxIndex; i++) {
          availableIndices.push(i);
        }
        
        for (let i = availableIndices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [availableIndices[i], availableIndices[j]] = [availableIndices[j], availableIndices[i]];
        }
        
        return availableIndices.slice(0, count);
      }

      function spawnPsychoImage(forcedIndex = null) {
        if (preloadedImages.length === 0) return;
        
        const randomIndex = (forcedIndex !== null) ? forcedIndex : Math.floor(Math.random() * preloadedImages.length);
        const imgSrc = imageFiles[randomIndex];
        
        const imgEl = document.createElement('img');
        imgEl.src = imgSrc;
        imgEl.classList.add('psycho-image');
        
        const size = randomInt(150, 500);
        imgEl.style.width = size + 'px';
        imgEl.style.height = 'auto';
        
        let left, top;
        const edge = Math.random();
        if (edge < 0.25) {
          left = randomFloat(-5, 30);
          top = randomFloat(5, 85);
        } else if (edge < 0.5) {
          left = randomFloat(65, 95);
          top = randomFloat(5, 85);
        } else if (edge < 0.75) {
          left = randomFloat(15, 75);
          top = randomFloat(-5, 20);
        } else {
          left = randomFloat(15, 75);
          top = randomFloat(75, 95);
        }
        
        imgEl.style.left = left + '%';
        imgEl.style.top = top + '%';
        
        const rotation = randomFloat(-20, 20);
        imgEl.style.transform = `rotate(${rotation}deg)`;
        
        imageContainer.appendChild(imgEl);
        
        requestAnimationFrame(() => {
          imgEl.classList.add('show');
        });
        
        if (Math.random() < 0.2) {
          setTimeout(() => {
            if (imgEl.parentNode) {
              imgEl.classList.add('flash');
              setTimeout(() => {
                if (imgEl.parentNode) imgEl.classList.remove('flash');
              }, 80);
            }
          }, randomInt(20, 150));
        }
        
        const lifetime = randomFloat(400, 2200);
        
        setTimeout(() => {
          if (imgEl.parentNode) {
            imgEl.style.opacity = '0';
            imgEl.style.transition = 'opacity 0.4s ease';
          }
        }, lifetime * 0.7);
        
        setTimeout(() => {
          if (imgEl.parentNode) {
            imgEl.remove();
          }
        }, lifetime + 150);
      }

      // Основной цикл спавна
      function spawnLoop() {
        const textCount = randomInt(1, 3);
        for (let i = 0; i < textCount; i++) {
          setTimeout(() => spawnFloatingText(), i * randomInt(40, 350));
        }
        
        if (Math.random() < 0.3) spawnStaticBurst();
        if (Math.random() < 0.1) spawnBracketFlash();
        
        if (Math.random() < 0.22) {
          const imageBurst = randomInt(1, 3);
          const uniqueIndices = getUniqueRandomIndices(imageBurst, imageFiles.length - 1);
          
          for (let i = 0; i < imageBurst; i++) {
            setTimeout(() => spawnPsychoImage(uniqueIndices[i]), i * randomInt(50, 200));
          }
        }
        
        const nextInterval = randomFloat(400, 2200);
        setTimeout(spawnLoop, nextInterval);
      }

      // Старт
      setTimeout(spawnLoop, 800);
      setTimeout(() => scheduleNextPhrase(), 7000);
      setTimeout(() => scheduleRedFlashMain(), 10000);
      
      setTimeout(() => {
        for (let i = 0; i < 5; i++) setTimeout(() => spawnFloatingText(), i * 120);
        if (Math.random() < 0.6) {
          setTimeout(() => {
            const initialBurst = randomInt(1, 3);
            const uniqueIndices = getUniqueRandomIndices(initialBurst, imageFiles.length - 1);
            
            for (let i = 0; i < initialBurst; i++) {
              setTimeout(() => spawnPsychoImage(uniqueIndices[i]), i * 180);
            }
          }, 400);
        }
      }, 300);
    })();
  </script>
</body>
</html>
