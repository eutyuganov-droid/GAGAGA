<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MANHUNT</title>
  <style>
    @font-face {
      font-family: "TrixiePro";
      src: url("assets/fonts/trixiepro_heavy.otf") format("opentype"),
           url("assets/fonts/trixiepro_heavy.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070706;
      color: #d6cec3;
      font-family: "TrixiePro", "Times New Roman", serif;
      user-select: none;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #070706;
    }

    .stage.is-glitch {
      transform: translate(2px, -1px);
    }

    .slide {
      position: absolute;
      inset: -4%;
      width: 108%;
      height: 108%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      filter: grayscale(0.38) contrast(1.12) brightness(0.52) saturate(0.55);
      transform: scale(1.04);
      transition: opacity 1.8s ease;
    }

    .slide.is-on {
      opacity: 1;
      animation: ken 22s ease-in-out infinite alternate;
    }

    @keyframes ken {
      from { transform: scale(1.04) translate(0, 0); }
      to { transform: scale(1.12) translate(-1.4%, -0.8%); }
    }

    .grade,
    .concrete,
    .grain,
    .scratches,
    .scan,
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .grade {
      background:
        linear-gradient(180deg, rgba(8, 7, 6, 0.42) 0%, rgba(8, 7, 6, 0.08) 38%, rgba(8, 7, 6, 0.78) 100%),
        linear-gradient(90deg, rgba(10, 9, 8, 0.35) 0%, transparent 22%, transparent 78%, rgba(10, 9, 8, 0.35) 100%);
      z-index: 2;
    }

    .concrete {
      z-index: 3;
      background: url("assets/fx/concrete.jpg") center / cover no-repeat;
      opacity: 0.14;
      mix-blend-mode: multiply;
    }

    .grain {
      z-index: 4;
      background: url("assets/fx/grain.jpg") repeat;
      background-size: 380px 380px;
      opacity: 0.16;
      mix-blend-mode: overlay;
      animation: grain 0.32s steps(2) infinite;
    }

    .scratches {
      z-index: 5;
      background: url("assets/fx/scratches.jpg") center / cover no-repeat;
      opacity: 0.11;
      mix-blend-mode: screen;
    }

    .scan {
      z-index: 6;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.16) 3px
      );
      opacity: 0.28;
    }

    .vignette {
      z-index: 7;
      box-shadow: inset 0 0 140px 36px rgba(0, 0, 0, 0.72);
    }

    @keyframes grain {
      from { background-position: 0 0; }
      to { background-position: 12px -8px; }
    }

    .title {
      position: fixed;
      left: 0;
      right: 0;
      top: 44%;
      z-index: 12;
      margin: 0;
      text-align: center;
      font-family: "TrixiePro", "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(56px, 11vw, 148px);
      line-height: 0.9;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      text-transform: uppercase;
      color: #e7e0d6;
      text-shadow: 0 2px 28px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    .caption {
      position: fixed;
      left: 8%;
      right: 8%;
      bottom: 7%;
      z-index: 12;
      text-align: center;
      font-size: clamp(14px, 1.7vw, 20px);
      letter-spacing: 0.08em;
      color: rgba(214, 206, 195, 0.82);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      opacity: 1;
      transition: opacity 1.6s ease;
    }

    .caption.is-out {
      opacity: 0;
    }

    .flick {
      position: fixed;
      z-index: 10;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(214, 206, 195, 0.34);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 1.4s ease;
    }

    .flick.is-on {
      opacity: 1;
    }

    .flick.is-hard {
      color: rgba(180, 70, 62, 0.48);
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="slides"></div>
    <div class="grade"></div>
    <div class="concrete"></div>
    <div class="grain"></div>
    <div class="scratches"></div>
    <div class="scan"></div>
    <div class="vignette"></div>
  </div>

  <div id="flecks"></div>
  <h1 class="title">MANHUNT</h1>
  <div class="caption" id="caption">Казнь: зайди со спины и удерживай E.</div>
  <audio id="theme" src="assets/audio/white-room.mp3" loop preload="auto"></audio>

  <script>
    (function () {
      var music = document.getElementById("theme");
      var musicVol = 0.55;
      var musicStarted = false;

      function applyMusicVol() {
        if (!music) return;
        music.volume = Math.max(0, Math.min(1, musicVol));
      }

      function startMusic() {
        if (!music || musicStarted) return;
        musicStarted = true;
        applyMusicVol();
        var playPromise = music.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function () {
            musicStarted = false;
          });
        }
      }
      var SCENES = [
        "assets/bg/01-alley.jpg",
        "assets/bg/02-warehouse.jpg",
        "assets/bg/03-garage.jpg",
        "assets/bg/04-underpass.jpg",
        "assets/bg/05-fence.jpg",
        "assets/bg/06-corridor.jpg"
      ];

      var CAPTIONS = [
        "Казнь: зайди со спины и удерживай E.",
        "Не беги и не дерись — казнь не пойдёт.",
        "Выживи до конца сцены. Охоться из тени.",
        "Найди жертву. Казни со спины — звёзды.",
        "Удар в спину сильнее, если зашёл сзади.",
        "Открытый бой — не ваншот. Боль и стамина.",
        "Оружие ломается. Не бей впустую.",
        "Лут в ящиках. У охотника — кирпич и фонарик.",
        "Жертва тише на шаге. Не высовывайся.",
        "ПКМ — блок. Тяжёлый удар добивает.",
        "Казнь работает с обеих сторон.",
        "Сцена длится девять минут.",
        "Крути QTE, пока идёт казнь.",
        "Охотник по охотнику бьёт слабее.",
        "Жертва выживает — если дожила сцену.",
        "Охотники закрывают сцену, если всех сняли."
      ];

      var WORDS = [
        "ЖЕРТВА", "ОХОТНИК", "КАЗНЬ", "СЦЕНА", "СПИНА", "ТЕНЬ",
        "УДЕРЖИВАЙ E", "ЗВЁЗДЫ", "НОЖ", "КИРПИЧ", "ФОНАРИК",
        "ЯЩИК", "БЛОК", "СТАМИНА", "БОЛЬ", "QTE",
        "CASH", "HUNT", "EXECUTE", "LIVE", "CUT"
      ];

      var slidesEl = document.getElementById("slides");
      var nodes = [];
      var i, n;

      for (i = 0; i < SCENES.length; i++) {
        n = document.createElement("div");
        n.className = "slide";
        n.style.backgroundImage = "url('" + SCENES[i] + "')";
        slidesEl.appendChild(n);
        nodes.push(n);
      }

      var idx = 0;
      nodes[0].className = "slide is-on";
      setInterval(function () {
        nodes[idx].className = "slide";
        idx = (idx + 1) % nodes.length;
        nodes[idx].className = "slide is-on";
      }, 7000);

      var capEl = document.getElementById("caption");
      var capI = 0;
      setInterval(function () {
        capEl.className = "caption is-out";
        setTimeout(function () {
          capI = (capI + 1) % CAPTIONS.length;
          capEl.innerHTML = CAPTIONS[capI];
          capEl.className = "caption";
        }, 1600);
      }, 11000);

      var stage = document.getElementById("stage");
      setInterval(function () {
        if (Math.random() > 0.4) return;
        stage.className = "stage is-glitch";
        setTimeout(function () { stage.className = "stage"; }, 70);
      }, 9000);

      var flecks = document.getElementById("flecks");
      var pool = [];
      for (i = 0; i < 8; i++) {
        n = document.createElement("div");
        n.className = "flick";
        flecks.appendChild(n);
        pool.push(n);
      }

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function flashOne(el) {
        var x = 4 + Math.random() * 88;
        var y = 8 + Math.random() * 78;
        if (y > 38 && y < 58) y = Math.random() < 0.5 ? 10 + Math.random() * 20 : 62 + Math.random() * 18;
        el.style.left = x + "%";
        el.style.top = y + "%";
        el.style.fontSize = (12 + Math.floor(Math.random() * 7)) + "px";
        el.innerHTML = pick(WORDS);
        el.className = Math.random() < 0.16 ? "flick is-on is-hard" : "flick is-on";
        setTimeout(function () {
          el.className = "flick";
        }, 2200 + Math.random() * 1800);
      }

      function tickFlecks() {
        flashOne(pick(pool));
        setTimeout(tickFlecks, 1600 + Math.random() * 1800);
      }
      setTimeout(tickFlecks, 900);

      window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode, volume) {
        if (typeof volume === "number" && !isNaN(volume)) {
          musicVol = volume;
        }
        applyMusicVol();
        startMusic();
      };

      window.SetFilesTotal = function () {};
      window.SetFilesNeeded = function () {};
      window.DownloadingFile = function () {};
      window.SetStatusChanged = function () {};

      applyMusicVol();
      setTimeout(startMusic, 400);
    })();
  </script>
</body>
</html>
