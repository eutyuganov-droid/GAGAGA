<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MELEECITY+ | Manhunt Style Psychosis</title>
  <style>
    :root {
      --bg: #000000;
      --text: #9a9a9a;
      --white: #e0e0e0;
      --accent: #ffffff;
      --dark-line: #2a2a2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      font-family: 'Courier New', 'Lucida Console', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: none;
    }

    /* Базовые эффекты окружения */
    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      background-image: repeating-radial-gradient(circle at 50% 50%, transparent 0, rgba(255, 255, 255, 0.02) 1px, transparent 2px);
      background-size: 4px 4px;
      animation: grain 0.5s steps(5) infinite;
    }
    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, -1px); }
    }
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 11;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.3) 2px, rgba(0, 0, 0, 0.3) 4px);
    }

    .vignette {
      display: none;
    }

    /* Контейнер */
    .container {
      position: relative;
      z-index: 5;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* ЗАГОЛОВОК */
    .title-wrapper {
      position: relative;
      display: inline-block;
    }
    .title {
      font-size: 76px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 14px;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 rgba(255, 255, 255, 0.15), -1px -1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      line-height: 1;
      display: inline-block;
    }

    .title-letter {
      display: inline-block;
      transition: color 0.15s ease, transform 0.15s ease, text-shadow 0.15s ease, opacity 0.15s ease;
      position: relative;
    }

    .title-letter.black-letter {
      color: #000000 !important;
      text-shadow: none !important;
    }

    .title-letter.red-letter {
      color: #ff1a1a !important;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.9), 0 0 40px rgba(255, 0, 0, 0.6) !important;
    }

    .title-letter.glitch-left {
      animation: letter-glitch-left 0.4s steps(3) forwards;
    }
    @keyframes letter-glitch-left {
      0% { transform: translate(0, 0); opacity: 1; }
      20% { transform: translate(-8px, 3px); opacity: 0.7; }
      40% { transform: translate(5px, -2px); opacity: 0.9; }
      60% { transform: translate(-12px, -4px); opacity: 0.4; }
      80% { transform: translate(3px, 1px); opacity: 0.8; }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    .title-letter.glitch-right {
      animation: letter-glitch-right 0.4s steps(3) forwards;
    }
    @keyframes letter-glitch-right {
      0% { transform: translate(0, 0); opacity: 1; }
      20% { transform: translate(8px, -3px); opacity: 0.7; }
      40% { transform: translate(-5px, 2px); opacity: 0.9; }
      60% { transform: translate(12px, 4px); opacity: 0.4; }
      80% { transform: translate(-3px, -1px); opacity: 0.8; }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    .title-letter.glitch-up {
      animation: letter-glitch-up 0.35s steps(3) forwards;
    }
    @keyframes letter-glitch-up {
      0% { transform: translate(0, 0); opacity: 1; }
      25% { transform: translate(3px, -10px); opacity: 0.5; }
      50% { transform: translate(-4px, 3px); opacity: 0.9; }
      75% { transform: translate(2px, -7px); opacity: 0.6; }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    .title-letter.glitch-down {
      animation: letter-glitch-down 0.35s steps(3) forwards;
    }
    @keyframes letter-glitch-down {
      0% { transform: translate(0, 0); opacity: 1; }
      25% { transform: translate(-3px, 10px); opacity: 0.5; }
      50% { transform: translate(4px, -3px); opacity: 0.9; }
      75% { transform: translate(-2px, 7px); opacity: 0.6; }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    .separator {
      width: 180px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #4a4a4a 15%, #8a8a8a 50%, #4a4a4a 85%, transparent 100%);
      opacity: 0.8;
    }

    /* Философская надпись */
    .big-subtitle {
      font-size: 18px;
      color: #999999;
      letter-spacing: 6px;
      text-transform: uppercase;
      opacity: 0.75;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
      animation: pulse-text 2.5s ease-in-out infinite;
      font-weight: bold;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      position: relative;
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }

    .big-subtitle.red-flash {
      color: #ff1a1a;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.9), 0 0 40px rgba(255, 0, 0, 0.5);
      animation: red-pulse 0.8s ease-out;
    }
    @keyframes red-pulse {
      0% { color: #ff1a1a; text-shadow: 0 0 20px rgba(255, 0, 0, 0.9), 0 0 40px rgba(255, 0, 0, 0.5); opacity: 1; }
      50% { color: #ff4d4d; text-shadow: 0 0 30px rgba(255, 0, 0, 1), 0 0 60px rgba(255, 0, 0, 0.7); opacity: 0.95; }
      100% { color: #999999; text-shadow: 0 0 8px rgba(255, 255, 255, 0.2); opacity: 0.75; }
    }

    .dots-container {
      display: inline-block;
      margin-left: 2px;
    }
    .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      margin-left: 5px;
      vertical-align: middle;
      opacity: 0;
      animation: dot-sequence 1.8s infinite;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }
    @keyframes dot-sequence {
      0%, 40% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      60%, 100% { opacity: 0; transform: scale(0.5); }
    }
    .dot.red-dot {
      background: #ff1a1a;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.9);
    }

    /* Углы */
    .corner-decoration { position: fixed; z-index: 3; pointer-events: none; }
    .corner-top-left { top: 30px; left: 30px; }
    .corner-top-right { top: 30px; right: 30px; }
    .corner-bottom-left { bottom: 30px; left: 30px; }
    .corner-bottom-right { bottom: 30px; right: 30px; }
    .corner-line { display: block; width: 30px; height: 1px; background: rgba(255, 255, 255, 0.15); margin: 5px 0; }
    .corner-top-left .corner-line:nth-child(1) { width: 32px; }
    .corner-top-left .corner-line:nth-child(2) { width: 20px; }
    .corner-top-left .corner-line:nth-child(3) { width: 10px; }
    .corner-top-right .corner-line:nth-child(1) { width: 10px; margin-left: auto; }
    .corner-top-right .corner-line:nth-child(2) { width: 20px; margin-left: auto; }
    .corner-top-right .corner-line:nth-child(3) { width: 32px; margin-left: auto; }
    .corner-bottom-left .corner-line:nth-child(1) { width: 10px; }
    .corner-bottom-left .corner-line:nth-child(2) { width: 20px; }
    .corner-bottom-left .corner-line:nth-child(3) { width: 32px; }
    .corner-bottom-right .corner-line:nth-child(1) { width: 32px; margin-left: auto; }
    .corner-bottom-right .corner-line:nth-child(2) { width: 20px; margin-left: auto; }
    .corner-bottom-right .corner-line:nth-child(3) { width: 10px; margin-left: auto; }

    /* Плавающий текст */
    .float-text {
      position: fixed;
      pointer-events: none;
      z-index: 8;
      font-family: 'Courier New', monospace;
      opacity: 0;
      transition: opacity 0.4s ease;
      text-transform: uppercase;
      will-change: transform, opacity;
    }
    .float-sm { font-size: 10px; letter-spacing: 4px; }
    .float-md { font-size: 13px; letter-spacing: 6px; font-weight: bold; }
    .float-lg { font-size: 18px; letter-spacing: 8px; font-weight: bold; }
    .float-xl { font-size: 24px; letter-spacing: 10px; font-weight: bold; }
    .float-bright { color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.6); }
    .float-mid { color: #aaaaaa; text-shadow: 0 0 6px rgba(255,255,255,0.3); }
    .float-dim { color: #666666; }
    .float-faint { color: #444444; }
    .float-glitch { animation: float-glitch-anim 0.3s steps(3) forwards; }
    @keyframes float-glitch-anim {
      0% { transform: translate(0, 0); opacity: 0.9; }
      20% { transform: translate(-4px, 2px); opacity: 0.7; }
      40% { transform: translate(3px, -1px); opacity: 1; }
      60% { transform: translate(-2px, -3px); opacity: 0.5; }
      80% { transform: translate(5px, 1px); opacity: 0.8; }
      100% { transform: translate(0, 0); opacity: 0; }
    }
    .float-red-flash { animation: red-text-flash 0.6s ease-out forwards !important; }
    @keyframes red-text-flash {
      0% { color: #ff1a1a; text-shadow: 0 0 15px rgba(255, 0, 0, 0.9), 0 0 30px rgba(255, 0, 0, 0.6); opacity: 0.95; }
      40% { color: #ff4d4d; text-shadow: 0 0 20px rgba(255, 0, 0, 1), 0 0 40px rgba(255, 0, 0, 0.8); opacity: 1; }
      100% { color: inherit; text-shadow: inherit; opacity: inherit; }
    }

    /* Эффекты VHS */
    .tracking-line {
      position: fixed;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
      z-index: 9;
      animation: tracking-move 4s linear infinite;
    }
    @keyframes tracking-move { 0% { top: -5%; } 100% { top: 105%; } }

    .static-burst {
      position: fixed;
      pointer-events: none;
      z-index: 13;
      background: rgba(255, 255, 255, 0.04);
      animation: burst 0.15s steps(4) forwards;
    }
    @keyframes burst { 0% { opacity: 0.7; } 50% { opacity: 0.15; } 100% { opacity: 0; } }

    .bracket-flash {
      position: fixed;
      pointer-events: none;
      z-index: 4;
      color: #ffffff;
      font-size: 20px;
      opacity: 0;
      animation: bracket-pop 0.6s ease-out forwards;
    }
    @keyframes bracket-pop {
      0% { opacity: 0; transform: scale(0.8); }
      30% { opacity: 0.9; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1); }
    }

    /* ПСИХОЗНЫЕ КАРТИНКИ */
    .psycho-image {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      border: none;
      outline: none;
      box-shadow: 0 0 40px 20px rgba(0, 0, 0, 0.9), 0 0 80px 40px rgba(0, 0, 0, 0.8), inset 0 0 60px 30px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.06s ease;
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 40%, rgba(0, 0, 0, 0.8) 60%, rgba(0, 0, 0, 0.3) 80%, rgba(0, 0, 0, 0) 100%);
      mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 40%, rgba(0, 0, 0, 0.8) 60%, rgba(0, 0, 0, 0.3) 80%, rgba(0, 0, 0, 0) 100%);
      filter: grayscale(0.85) contrast(1.4) brightness(0.75) blur(0.5px);
      mix-blend-mode: hard-light;
      transform-origin: center;
      image-rendering: auto;
    }
    .psycho-image.show {
      opacity: 0.8;
      animation: psycho-pop 0.12s ease-out;
    }
    @keyframes psycho-pop {
      0% { transform: scale(0.7); opacity: 0; filter: grayscale(0.85) contrast(1.4) brightness(0.75) blur(2px); }
      40% { transform: scale(1.08); opacity: 0.9; filter: grayscale(0.5) contrast(1.6) brightness(0.85) blur(0.5px); }
      100% { transform: scale(1); opacity: 0.8; filter: grayscale(0.85) contrast(1.4) brightness(0.75) blur(0.5px); }
    }
    .psycho-image.flash {
      opacity: 0.95;
      filter: grayscale(0.1) contrast(2.0) brightness(1.2) blur(0px);
      mix-blend-mode: normal;
      box-shadow: 0 0 50px 25px rgba(255, 255, 255, 0.2), 0 0 100px 50px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
    }

    /* ===== ГАЗЕТНЫЕ ВЫРЕЗКИ С ЭФФЕКТОМ НАСТОЯЩЕЙ БУМАГИ ===== */
    .newspaper-clipping {
      position: fixed;
      pointer-events: none;
      z-index: 15;
      
      /* Базовый цвет бумаги */
      background-color: #c4b896;
      
      /* Текстура бумаги: волокна */
      background-image: 
        /* Микроволокна */
        repeating-linear-gradient(
          2deg,
          transparent,
          transparent 2px,
          rgba(180, 160, 130, 0.3) 2px,
          rgba(180, 160, 130, 0.3) 2.5px
        ),
        /* Длинные волокна */
        repeating-linear-gradient(
          87deg,
          transparent,
          transparent 40px,
          rgba(200, 180, 150, 0.2) 40px,
          rgba(200, 180, 150, 0.2) 41px
        ),
        /* Пятна влаги */
        radial-gradient(
          ellipse at 20% 30%,
          rgba(160, 140, 100, 0.4) 0%,
          transparent 50%
        ),
        radial-gradient(
          ellipse at 75% 60%,
          rgba(180, 160, 120, 0.3) 0%,
          transparent 40%
        ),
        radial-gradient(
          ellipse at 50% 80%,
          rgba(200, 180, 140, 0.25) 0%,
          transparent 35%
        ),
        /* Жирные пятна */
        radial-gradient(
          circle at 85% 15%,
          rgba(140, 120, 80, 0.5) 0%,
          transparent 25%
        ),
        /* Выцветание */
        radial-gradient(
          ellipse at 30% 70%,
          rgba(220, 210, 180, 0.3) 0%,
          transparent 45%
        ),
        /* Микротрещины */
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 15px,
          rgba(0, 0, 0, 0.03) 15px,
          rgba(0, 0, 0, 0.03) 15.5px
        );
      
      /* Рваные края через clip-path */
      clip-path: polygon(
        0% 2%, 2% 0%, 8% 1%, 15% 0%, 20% 3%, 28% 0%, 35% 2%, 42% 0%, 50% 3%, 58% 0%, 65% 2%, 72% 1%, 80% 3%, 88% 0%, 95% 2%, 98% 0%, 100% 3%,
        100% 95%, 98% 100%, 92% 97%, 85% 100%, 78% 98%, 70% 100%, 62% 97%, 55% 100%, 48% 98%, 40% 100%, 32% 97%, 25% 100%, 18% 98%, 10% 100%, 5% 97%, 0% 95%,
        0% 70%, 2% 55%, 0% 40%, 3% 25%, 0% 10%
      );
      
      border: none;
      box-shadow: 
        0 5px 25px rgba(0, 0, 0, 0.9),
        0 2px 10px rgba(0, 0, 0, 0.7),
        inset 0 0 30px rgba(0, 0, 0, 0.3),
        inset 0 0 5px rgba(0, 0, 0, 0.2);
      
      padding: 25px 28px;
      max-width: 520px;
      min-width: 300px;
      opacity: 0;
      transform: rotate(-1deg) scale(0.9);
      transition: opacity 0.5s ease, transform 0.5s ease;
      font-family: 'Times New Roman', 'Georgia', serif;
      color: #3a3020;
      text-transform: none;
      letter-spacing: 0.5px;
      overflow: hidden;
    }

    /* Эффект печатной машинки для текста */
    .newspaper-text {
      font-size: 12px;
      line-height: 1.6;
      color: #2a2218;
      opacity: 0.9;
      margin-bottom: 8px;
      font-family: 'Courier New', 'Lucida Console', monospace;
      letter-spacing: 0.3px;
      text-shadow: 0 0 1px rgba(0, 0, 0, 0.3);
    }

    /* Заголовок газеты */
    .newspaper-header {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #4a3a20;
      border-bottom: 2px solid rgba(60, 40, 20, 0.4);
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
    }

    .newspaper-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #1a1008;
      margin-bottom: 10px;
      line-height: 1.3;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      font-family: 'Times New Roman', serif;
    }

    .newspaper-footer {
      font-size: 9px;
      color: #5a4a30;
      text-align: right;
      font-style: italic;
      margin-top: 10px;
      border-top: 1px solid rgba(60, 40, 20, 0.3);
      padding-top: 8px;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    /* Кровавая печать */
    .blood-stamp {
      position: absolute;
      bottom: 18px;
      right: 18px;
      font-size: 26px;
      color: rgba(180, 30, 30, 0.5);
      font-family: 'Courier New', monospace;
      font-weight: bold;
      transform: rotate(-15deg);
      letter-spacing: 3px;
      pointer-events: none;
      text-shadow: 
        0 0 10px rgba(255, 0, 0, 0.3),
        0 0 20px rgba(200, 0, 0, 0.2);
    }

    /* Печать СЕКРЕТНО */
    .secret-stamp {
      position: absolute;
      top: 15px;
      right: 20px;
      color: rgba(200, 30, 30, 0.45);
      font-size: 11px;
      font-weight: bold;
      border: 2px solid rgba(200, 30, 30, 0.45);
      padding: 4px 10px;
      transform: rotate(8deg);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-family: 'Courier New', monospace;
      pointer-events: none;
      text-shadow: 0 0 5px rgba(255, 0, 0, 0.3);
    }

    /* Фотография в газете */
    .newspaper-image {
      width: 100%;
      height: auto;
      margin: 12px 0;
      filter: sepia(0.8) contrast(1.1) brightness(0.75) grayscale(0.3);
      border: 2px solid rgba(60, 40, 20, 0.3);
      box-shadow: 
        0 2px 8px rgba(0, 0, 0, 0.5),
        inset 0 0 10px rgba(0, 0, 0, 0.3);
      border-radius: 2px;
    }

    /* Номер дела */
    .case-number {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 7px;
      color: rgba(60, 40, 20, 0.5);
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
    }

    /* Красная пометка маркером */
    .red-mark {
      background: rgba(255, 200, 0, 0.2);
      border-left: 3px solid rgba(200, 30, 30, 0.6);
      padding-left: 8px;
      margin: 6px 0;
      font-weight: bold;
    }

    /* Эффект сложенной бумаги */
    .fold-line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(0, 0, 0, 0.1);
      box-shadow: 0 1px 2px rgba(255, 255, 255, 0.2), 0 -1px 2px rgba(0, 0, 0, 0.1);
      pointer-events: none;
    }

    .newspaper-clipping.show {
      opacity: 0.94;
      transform: rotate(-1deg) scale(1);
      animation: newspaper-appear 0.6s ease-out;
    }
    @keyframes newspaper-appear {
      0% { opacity: 0; transform: rotate(-4deg) scale(0.8); }
      40% { opacity: 0.5; transform: rotate(1deg) scale(1.04); }
      70% { opacity: 0.85; transform: rotate(-2deg) scale(0.98); }
      100% { opacity: 0.94; transform: rotate(-1deg) scale(1); }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="scanlines"></div>
  <div class="tracking-line"></div>

  <div class="corner-decoration corner-top-left"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>
  <div class="corner-decoration corner-top-right"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>
  <div class="corner-decoration corner-bottom-left"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>
  <div class="corner-decoration corner-bottom-right"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>

  <div class="container">
    <div class="title-wrapper">
      <h1 class="title" id="mainTitle"></h1>
    </div>
    <div class="separator"></div>
    <p class="big-subtitle" id="mainPhrase">
      ВЫ СТАНОВИТЕСЬ ЧЕМ-ТО БОЛЬШИМ
      <span class="dots-container" id="dotsContainer">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
    </p>
  </div>

  <div id="floatingTexts"></div>
  <div id="psychoImages"></div>
  <div id="newspapers"></div>

  <script>
    (function() {
      // ========== ЗАГОЛОВОК ==========
      const titleText = "MELEECITY+";
      const mainTitleElement = document.getElementById('mainTitle');

      function buildTitle() {
        mainTitleElement.innerHTML = '';

          spawnNewspaper();
        }

        const nextInterval = randomFloat(400, 2200);
        setTimeout(spawnLoop, nextInterval);
      }

      // СТАРТ
      setTimeout(spawnLoop, 800);
      setTimeout(() => scheduleNextPhrase(), 7000);
      setTimeout(() => scheduleRedFlashMain(), 10000);

      setTimeout(() => {
        for (let i = 0; i < 5; i++) setTimeout(() => spawnFloatingText(), i * 120);
        if (Math.random() < 0.6) {
          setTimeout(() => {
            const initialBurst = randomInt(1, 3);
            const uniqueIndices = getUniqueRandomIndices(initialBurst, imageFiles.length - 1);
            for (let i = 0; i < initialBurst; i++) {
              setTimeout(() => spawnPsychoImage(uniqueIndices[i]), i * 180);
            }
          }, 400);
        }
        if (Math.random() < 0.3) {
          setTimeout(() => spawnNewspaper(), 5000);
        }
      }, 300);
    })();
  </script>
