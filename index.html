<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MELEECITY+ | Manhunt Style Psychosis</title>
  <style>
    :root {
      --bg: #000000;
      --text: #9a9a9a;
      --white: #e0e0e0;
      --accent: #ffffff;
      --dark-line: #2a2a2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      font-family: 'Courier New', 'Lucida Console', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: none;
    }

    /* Базовые эффекты окружения */
    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      background-image: repeating-radial-gradient(circle at 50% 50%, transparent 0, rgba(255, 255, 255, 0.02) 1px, transparent 2px);
      background-size: 4px 4px;
      animation: grain 0.5s steps(5) infinite;
    }
    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, -1px); }
    }
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 11;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.3) 2px, rgba(0, 0, 0, 0.3) 4px);
    }
    
    /* Vignette убран для чистого чёрного фона */
    .vignette {
      display: none;
    }

    /* Контейнер */
    .container {
      position: relative;
      z-index: 5;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
    }

    .title-wrapper {
      position: relative;
      display: inline-block;
    }
    .title {
      font-size: 76px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 14px;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 rgba(255, 255, 255, 0.15), -1px -1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      line-height: 1;
    }
    .title::before,
    .title::after {
      content: 'MELEECITY+';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.4;
      pointer-events: none;
    }
    .title::before {
      color: #aaaaaa;
      animation: glitch-1 3.5s infinite linear alternate-reverse;
      clip-path: inset(0 0 55% 0);
    }
    .title::after {
      color: #666666;
      animation: glitch-2 2.8s infinite linear alternate-reverse;
      clip-path: inset(45% 0 0 0);
    }
    @keyframes glitch-1 {
      0%, 92%, 100% { transform: translate(0); }
      93% { transform: translate(-2px, 1px); }
      94% { transform: translate(3px, -2px); }
      95% { transform: translate(-1px, -2px); }
      96% { transform: translate(2px, 1px); }
    }
    @keyframes glitch-2 {
      0%, 88%, 100% { transform: translate(0); }
      89% { transform: translate(2px, -1px); }
      90% { transform: translate(-3px, 2px); }
      91% { transform: translate(1px, 1px); }
      92% { transform: translate(-2px, -1px); }
    }

    .subtitle {
      font-size: 13px;
      color: #9a9a9a;
      letter-spacing: 10px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: -12px;
      animation: pulse-text 2.5s ease-in-out infinite;
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.85; }
    }
    .separator {
      width: 180px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #4a4a4a 15%, #8a8a8a 50%, #4a4a4a 85%, transparent 100%);
      opacity: 0.8;
    }
    .static-text {
      font-size: 11px;
      color: #666666;
      letter-spacing: 8px;
      text-transform: uppercase;
      opacity: 0.6;
      animation: flicker 4s infinite;
    }
    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 0.6; }
      20%, 24%, 55% { opacity: 0.2; }
    }
    .blink-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      margin-left: 2px;
      vertical-align: middle;
      animation: dot-blink 1.3s step-end infinite;
      opacity: 0.8;
    }
    @keyframes dot-blink {
      0%, 55% { opacity: 0.8; }
      56%, 100% { opacity: 0; }
    }

    /* Угловые элементы */
    .corner-decoration { position: fixed; z-index: 3; pointer-events: none; }
    .corner-top-left { top: 30px; left: 30px; }
    .corner-top-right { top: 30px; right: 30px; }
    .corner-bottom-left { bottom: 30px; left: 30px; }
    .corner-bottom-right { bottom: 30px; right: 30px; }
    .corner-line { display: block; width: 30px; height: 1px; background: rgba(255, 255, 255, 0.15); margin: 5px 0; }
    .corner-top-left .corner-line:nth-child(1) { width: 32px; }
    .corner-top-left .corner-line:nth-child(2) { width: 20px; }
    .corner-top-left .corner-line:nth-child(3) { width: 10px; }
    .corner-top-right .corner-line:nth-child(1) { width: 10px; margin-left: auto; }
    .corner-top-right .corner-line:nth-child(2) { width: 20px; margin-left: auto; }
    .corner-top-right .corner-line:nth-child(3) { width: 32px; margin-left: auto; }
    .corner-bottom-left .corner-line:nth-child(1) { width: 10px; }
    .corner-bottom-left .corner-line:nth-child(2) { width: 20px; }
    .corner-bottom-left .corner-line:nth-child(3) { width: 32px; }
    .corner-bottom-right .corner-line:nth-child(1) { width: 32px; margin-left: auto; }
    .corner-bottom-right .corner-line:nth-child(2) { width: 20px; margin-left: auto; }
    .corner-bottom-right .corner-line:nth-child(3) { width: 10px; margin-left: auto; }

    /* Плавающий текст */
    .float-text {
      position: fixed;
      pointer-events: none;
      z-index: 8;
      font-family: 'Courier New', monospace;
      opacity: 0;
      transition: opacity 0.4s ease;
      text-transform: uppercase;
      will-change: transform, opacity;
    }
    .float-sm { font-size: 10px; letter-spacing: 4px; }
    .float-md { font-size: 13px; letter-spacing: 6px; font-weight: bold; }
    .float-lg { font-size: 18px; letter-spacing: 8px; font-weight: bold; }
    .float-xl { font-size: 24px; letter-spacing: 10px; font-weight: bold; }
    .float-bright { color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.6); }
    .float-mid { color: #aaaaaa; text-shadow: 0 0 6px rgba(255,255,255,0.3); }
    .float-dim { color: #666666; }
    .float-faint { color: #444444; }
    .float-glitch {
      animation: float-glitch-anim 0.3s steps(3) forwards;
    }
    @keyframes float-glitch-anim {
      0% { transform: translate(0, 0); opacity: 0.9; }
      20% { transform: translate(-4px, 2px); opacity: 0.7; }
      40% { transform: translate(3px, -1px); opacity: 1; }
      60% { transform: translate(-2px, -3px); opacity: 0.5; }
      80% { transform: translate(5px, 1px); opacity: 0.8; }
      100% { transform: translate(0, 0); opacity: 0; }
    }

    /* Эффекты VHS */
    .tracking-line {
      position: fixed;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
      z-index: 9;
      animation: tracking-move 4s linear infinite;
    }
    @keyframes tracking-move { 0% { top: -5%; } 100% { top: 105%; } }

    .static-burst {
      position: fixed;
      pointer-events: none;
      z-index: 13;
      background: rgba(255, 255, 255, 0.04);
      animation: burst 0.15s steps(4) forwards;
    }
    @keyframes burst { 0% { opacity: 0.7; } 50% { opacity: 0.15; } 100% { opacity: 0; } }

    .bracket-flash {
      position: fixed;
      pointer-events: none;
      z-index: 4;
      color: #ffffff;
      font-size: 20px;
      opacity: 0;
      animation: bracket-pop 0.6s ease-out forwards;
    }
    @keyframes bracket-pop {
      0% { opacity: 0; transform: scale(0.8); }
      30% { opacity: 0.9; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1); }
    }

    /* СТИЛИ ДЛЯ ПСИХОЗНЫХ КАРТИНОК */
    .psycho-image {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 25px rgba(0,0,0,0.95), inset 0 0 20px rgba(255,255,255,0.25);
      opacity: 0;
      transition: opacity 0.06s ease;
      filter: grayscale(0.85) contrast(1.4) brightness(0.75);
      mix-blend-mode: hard-light;
      transform-origin: center;
      image-rendering: auto;
    }
    .psycho-image.show {
      opacity: 0.75;
      animation: psycho-pop 0.12s ease-out;
    }
    @keyframes psycho-pop {
      0% { transform: scale(0.7); opacity: 0; }
      40% { transform: scale(1.08); opacity: 0.95; }
      100% { transform: scale(1); opacity: 0.75; }
    }
    .psycho-image.flash {
      opacity: 0.95;
      filter: grayscale(0.1) contrast(2.0) brightness(1.2);
      mix-blend-mode: normal;
      box-shadow: 0 0 50px rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="scanlines"></div>
  <!-- Vignette удалён -->
  <div class="tracking-line"></div>

  <div class="corner-decoration corner-top-left"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>
  <div class="corner-decoration corner-top-right"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>
  <div class="corner-decoration corner-bottom-left"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>
  <div class="corner-decoration corner-bottom-right"><div class="corner-line"></div><div class="corner-line"></div><div class="corner-line"></div></div>

  <div class="container">
    <div class="title-wrapper"><h1 class="title">MELEECITY+</h1></div>
    <p class="subtitle">// SURVIVE THE HUNT</p>
    <div class="separator"></div>
    <p class="static-text">AWAITING CONNECTION<span class="blink-dot"></span></p>
  </div>

  <div id="floatingTexts"></div>
  <div id="psychoImages"></div>

  <audio id="bg-music" loop preload="auto" style="display: none;">
    <source src="" type="audio/mpeg">
  </audio>

  <script>
    (function() {
      // ---------- ПЛАВАЮЩИЙ ТЕКСТ ----------
      const floatingContainer = document.getElementById('floatingTexts');
      const phrases = [
        { text: "KILL OR BE KILLED", weight: 3 }, { text: "NO ESCAPE", weight: 3 },
        { text: "WATCH YOUR BACK", weight: 2 }, { text: "HE'S WATCHING", weight: 2 },
        { text: "RUN", weight: 3 }, { text: "HIDE", weight: 2 }, { text: "SURVIVE", weight: 3 },
        { text: "EXECUTE", weight: 2 }, { text: "HUNTED", weight: 2 }, { text: "PREY", weight: 2 },
        { text: "NO MERCY", weight: 2 }, { text: "FEAR", weight: 2 }, { text: "DEATH", weight: 2 },
        { text: "SILENCE", weight: 2 }, { text: "DARKNESS", weight: 2 }, { text: "OBEY", weight: 1 },
        { text: "NO HOPE", weight: 1 }, { text: "THE HUNT BEGINS", weight: 1 }, { text: "DON'T LOOK BACK", weight: 1 },
        { text: "MANHUNT", weight: 1 }, { text: "HATRED", weight: 1 },
        { text: "УБЕЙ ИЛИ УМРИ", weight: 1 }, { text: "ВЫХОДА НЕТ", weight: 1 }, { text: "СТРАХ", weight: 1 },
        { text: "СМЕРТЬ", weight: 1 }, { text: "БЕГИ", weight: 1 }, { text: "ПРЯЧЬСЯ", weight: 1 },
        { text: "ТЕНЬ", weight: 1 }, { text: "АГОНИЯ", weight: 1 }, { text: "САНЯ ЛОХ", weight: 1 }
      ];

      let weightedPhrases = [];
      phrases.forEach(p => { for (let i = 0; i < p.weight; i++) weightedPhrases.push(p.text); });

      const sizeClasses = ['float-sm', 'float-md', 'float-md', 'float-lg', 'float-xl'];
      const sizeWeights = [4, 5, 4, 2, 1];
      let weightedSizes = [];
      sizeClasses.forEach((s, i) => { for (let j = 0; j < sizeWeights[i]; j++) weightedSizes.push(s); });

      const colorClasses = ['float-bright', 'float-mid', 'float-mid', 'float-dim', 'float-dim', 'float-faint'];
      const colorWeights = [1, 3, 3, 3, 2, 2];
      let weightedColors = [];
      colorClasses.forEach((c, i) => { for (let j = 0; j < colorWeights[i]; j++) weightedColors.push(c); });

      function randomFromArray(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function randomFloat(min, max) { return Math.random() * (max - min) + min; }

      function spawnFloatingText() {
        const el = document.createElement('div');
        el.classList.add('float-text');
        el.classList.add(randomFromArray(weightedSizes));
        el.classList.add(randomFromArray(weightedColors));
        el.textContent = randomFromArray(weightedPhrases);

        let x, y;
        const zone = Math.random();
        if (zone < 0.25) { x = randomFloat(5, 90); y = randomFloat(3, 25); }
        else if (zone < 0.5) { x = randomFloat(5, 90); y = randomFloat(70, 93); }
        else if (zone < 0.75) { x = randomFloat(2, 20); y = randomFloat(20, 75); }
        else { x = randomFloat(78, 95); y = randomFloat(20, 75); }

        el.style.left = x + '%';
        el.style.top = y + '%';
        el.style.transform = `rotate(${randomFloat(-8, 8)}deg)`;

        if (Math.random() < 0.15) el.classList.add('float-glitch');
        floatingContainer.appendChild(el);

        requestAnimationFrame(() => { el.style.opacity = '1'; });

        const isGlitch = el.classList.contains('float-glitch');
        const lifetime = isGlitch ? randomFloat(300, 600) : randomFloat(2000, 5000);
        setTimeout(() => { el.style.opacity = '0'; }, lifetime * 0.7);
        setTimeout(() => { if (el.parentNode) el.remove(); }, lifetime);
      }

      function spawnStaticBurst() {
        const burst = document.createElement('div');
        burst.classList.add('static-burst');
        burst.style.left = randomFloat(0, 95) + '%';
        burst.style.top = randomFloat(0, 95) + '%';
        burst.style.width = randomFloat(30, 200) + 'px';
        burst.style.height = randomFloat(2, 8) + 'px';
        document.body.appendChild(burst);
        setTimeout(() => { if (burst.parentNode) burst.remove(); }, 200);
      }

      function spawnBracketFlash() {
        const flash = document.createElement('div');
        flash.classList.add('bracket-flash');
        flash.textContent = randomFromArray(['[', ']', '//', '\\\\', '<', '>', '{', '}', '|', '#']);
        flash.style.left = randomFloat(3, 93) + '%';
        flash.style.top = randomFloat(3, 93) + '%';
        document.body.appendChild(flash);
        setTimeout(() => { if (flash.parentNode) flash.remove(); }, 700);
      }

      // ---------- ПСИХОЗНЫЕ КАРТИНКИ ----------
      const imageContainer = document.getElementById('psychoImages');
      
      // Генерируем массив имён файлов: 0.jpg, 1.jpg, 2.jpg, ..., 19.jpg
      const imageFiles = [];
      for (let i = 0; i <= 19; i++) {
        imageFiles.push(i + '.jpg');
      }
      
      console.log('Загружено изображений: ' + imageFiles.length + ' (0.jpg - 19.jpg)');
      
      // Предзагрузка всех 20 изображений
      const preloadedImages = [];
      imageFiles.forEach((file, index) => {
        const img = new Image();
        img.src = file;
        img.onerror = () => console.warn('Изображение не найдено: ' + file);
        img.onload = () => console.log('Загружено: ' + file);
        preloadedImages.push(img);
      });

      function spawnPsychoImage() {
        if (preloadedImages.length === 0) return;
        
        // Выбираем случайную картинку из 20 доступных
        const randomIndex = Math.floor(Math.random() * preloadedImages.length);
        const imgSrc = imageFiles[randomIndex];
        
        const imgEl = document.createElement('img');
        imgEl.src = imgSrc;
        imgEl.classList.add('psycho-image');
        
        // Случайный размер: от 100px до 450px
        const size = randomInt(100, 450);
        imgEl.style.width = size + 'px';
        imgEl.style.height = 'auto';
        
        // Позиция: случайная по всему экрану
        let left, top;
        const edge = Math.random();
        if (edge < 0.25) {
          left = randomFloat(-5, 30);
          top = randomFloat(5, 85);
        } else if (edge < 0.5) {
          left = randomFloat(65, 95);
          top = randomFloat(5, 85);
        } else if (edge < 0.75) {
          left = randomFloat(15, 75);
          top = randomFloat(-5, 20);
        } else {
          left = randomFloat(15, 75);
          top = randomFloat(75, 95);
        }
        
        imgEl.style.left = left + '%';
        imgEl.style.top = top + '%';
        
        // Случайный поворот от -25 до +25 градусов
        const rotation = randomFloat(-25, 25);
        imgEl.style.transform = `rotate(${rotation}deg)`;
        
        imageContainer.appendChild(imgEl);
        
        // Запускаем появление
        requestAnimationFrame(() => {
          imgEl.classList.add('show');
        });
        
        // Эффект "вспышки" (25% шанс)
        if (Math.random() < 0.25) {
          setTimeout(() => {
            if (imgEl.parentNode) {
              imgEl.classList.add('flash');
              setTimeout(() => {
                if (imgEl.parentNode) imgEl.classList.remove('flash');
              }, 100);
            }
          }, randomInt(30, 180));
        }
        
        // Время жизни: от 0.3 до 2.0 секунд
        const lifetime = randomFloat(300, 2000);
        
        // Плавное исчезновение
        setTimeout(() => {
          if (imgEl.parentNode) {
            imgEl.style.opacity = '0';
            imgEl.style.transition = 'opacity 0.3s ease';
          }
        }, lifetime * 0.75);
        
        // Удаление
        setTimeout(() => {
          if (imgEl.parentNode) {
            imgEl.remove();
          }
        }, lifetime + 100);
      }

      // Основной цикл спавна
      function spawnLoop() {
        const textCount = randomInt(1, 3);
        for (let i = 0; i < textCount; i++) {
          setTimeout(() => spawnFloatingText(), i * randomInt(40, 350));
        }
        
        if (Math.random() < 0.3) spawnStaticBurst();
        if (Math.random() < 0.1) spawnBracketFlash();
        
        // КАРТИНКИ: появляются с вероятностью ~22%
        if (Math.random() < 0.22) {
          // Иногда спавним 1-3 картинки подряд
          const imageBurst = randomInt(1, 3);
          for (let i = 0; i < imageBurst; i++) {
            setTimeout(() => spawnPsychoImage(), i * randomInt(50, 200));
          }
        }
        
        const nextInterval = randomFloat(400, 2200);
        setTimeout(spawnLoop, nextInterval);
      }

      // Музыка
      const audio = document.getElementById('bg-music');
      audio.volume = 0.7;
      
      function tryPlayMusic() {
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            const resumeMusic = () => {
              audio.play().catch(e => {});
              document.removeEventListener('click', resumeMusic);
              spawnBracketFlash();
            };
            document.addEventListener('click', resumeMusic, { once: true });
          });
        }
      }
      
      window.addEventListener('load', () => {
        setTimeout(tryPlayMusic, 500);
      });
      
      let beatInterval;
      audio.addEventListener('play', () => {
        beatInterval = setInterval(() => {
          spawnFloatingText();
          if (Math.random() < 0.3) spawnStaticBurst();
          // Под бит картинки появляются чаще
          if (Math.random() < 0.18) spawnPsychoImage();
        }, randomFloat(800, 2200));
      });
      
      audio.addEventListener('pause', () => clearInterval(beatInterval));
      audio.addEventListener('ended', () => clearInterval(beatInterval));

      // Старт
      setTimeout(spawnLoop, 800);
      setTimeout(() => {
        for (let i = 0; i < 5; i++) setTimeout(() => spawnFloatingText(), i * 120);
        // Начальный всплеск картинок
        if (Math.random() < 0.6) {
          setTimeout(() => {
            const initialBurst = randomInt(1, 3);
            for (let i = 0; i < initialBurst; i++) {
              setTimeout(() => spawnPsychoImage(), i * 180);
            }
          }, 400);
        }
      }, 300);
    })();
  </script>
</body>
</html>
